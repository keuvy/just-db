services:
  just-db:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - justdb-data:/data
    environment:
      JUSTDB_LISTEN: 0.0.0.0:8080
      JUSTDB_DATA: /data
      JUSTDB_AUTH_USER: ${JUSTDB_AUTH_USER:-}
      JUSTDB_AUTH_PASSWORD: ${JUSTDB_AUTH_PASSWORD:-}
      JUSTDB_ALLOWED_IPS: ${JUSTDB_ALLOWED_IPS:-}
      JUSTDB_TRUSTED_PROXIES: ${JUSTDB_TRUSTED_PROXIES:-}
      JUSTDB_ENGINE: ${JUSTDB_ENGINE:-postgres}
      JUSTDB_HOST: ${JUSTDB_HOST:-}
      JUSTDB_PORT: ${JUSTDB_PORT:-}
      JUSTDB_USER: ${JUSTDB_USER:-}
      JUSTDB_PASSWORD: ${JUSTDB_PASSWORD:-}
      JUSTDB_DATABASE: ${JUSTDB_DATABASE:-}
      JUSTDB_SSLMODE: ${JUSTDB_SSLMODE:-disable}
      JUSTDB_PROFILES_KEY: ${JUSTDB_PROFILES_KEY:-}

  postgres:
    profiles: ["test"]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: justdb
      POSTGRES_PASSWORD: justdb
      POSTGRES_DB: justdb
    ports:
      - "127.0.0.1:55432:5432"

  mysql:
    profiles: ["test"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: justdb
      MYSQL_USER: justdb
      MYSQL_PASSWORD: justdb
      MYSQL_DATABASE: justdb
    ports:
      - "127.0.0.1:33060:3306"

volumes:
  justdb-data:
